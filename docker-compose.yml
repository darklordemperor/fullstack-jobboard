services:
  laravel-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env.docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - job-board

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env.docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped
    networks:
      - job-board

  backend-test:
    profiles:
      - test
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: vendor/bin/pest --compact
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env.testing
    networks:
      - job-board

  backend-e2e:
    profiles:
      - e2e
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - >-
        mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
        && touch /e2e/database.sqlite
        && chown -R www-data:www-data /e2e
        && chmod -R ug+rwX storage bootstrap/cache /e2e
        && php artisan migrate:fresh --seed --force
        && php-fpm -D
        && nginx -g 'daemon off;'
    ports:
      - "8001:80"
    volumes:
      - ./backend:/var/www/html
      - e2e-data:/e2e
    environment:
      APP_NAME: Job Board E2E
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      FRONTEND_URL: http://localhost:3001
      DB_CONNECTION: sqlite
      DB_DATABASE: /e2e/database.sqlite
      SESSION_DRIVER: database
      SESSION_COOKIE: job_board_session
      SESSION_DOMAIN: null
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      SANCTUM_STATEFUL_DOMAINS: localhost:3001,frontend-e2e:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3001,http://frontend-e2e:3000
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - job-board

  nextjs-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: ["sh", "docker/dev-start.sh"]
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/.env.docker
    depends_on:
      - laravel-api
    networks:
      - job-board

  frontend-e2e:
    profiles:
      - e2e
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "3001:3000"
    environment:
      NEXT_INTERNAL_API_URL: http://backend-e2e:80
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - job-board

  playwright-e2e:
    profiles:
      - e2e
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    init: true
    ipc: host
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend-e2e:3000
      CI: "true"
    volumes:
      - ./frontend/playwright-report:/app/playwright-report
      - ./frontend/test-results:/app/test-results
    depends_on:
      frontend-e2e:
        condition: service_healthy
    networks:
      - job-board

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: dashboard_api
      MYSQL_USER: dashboard_api
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-board

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - job-board

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - job-board

networks:
  job-board:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  e2e-data:
